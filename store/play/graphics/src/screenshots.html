<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Taily Play screenshots</title>
    <!--
      Google Play phone screenshots, 1080 x 1920 (Play takes 9:16 only). One frame per load:
      screenshots.html?n=1 ... ?n=8, rendered to JPEG by scripts/play-graphics.mjs from the real
      screens it captures into screens/.

      Design read: the feature graphic's system, carried into portrait. One benefit per frame,
      a headline big enough to read in the store's thumbnail strip, the real screen below it in
      the phone the highlight film draws (same bezel, punch-hole, status bar and gesture strip).
      Ground #edf0f5, ink #1a212b, muted #56616d. The one highlight is the app's own tag chip:
      a pill in the accent (sky #91bae3, the light-theme blue). Frame 7 shows dark mode, so its
      ground goes dark too and its pill takes the screen's lavender.
      Type: Plus Jakarta Sans 800 for headlines, 500 for the line under them.
    -->
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 400 800;
        src: url(../../../../public/fonts/f4-LDIoaomQNQcsA88c7O9yZ4KMCoOg4Ko20yw.woff2) format('woff2');
      }
      :root {
        --ground: #edf0f5;
        --ink: #1a212b;
        --muted: #56616d;
        --pill: #91bae3;
        --pill-ink: #1a212b;
        --hi: rgba(255, 255, 255, 0.92);
        --lo: rgba(140, 150, 165, 0.5);
        --glow:
          radial-gradient(80% 52% at 22% 12%, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.18) 38%, rgba(255, 255, 255, 0) 74%),
          radial-gradient(90% 55% at 80% 105%, rgba(140, 150, 165, 0.16) 0%, rgba(140, 150, 165, 0) 70%);
      }
      .night {
        --ground: #14171b;
        --ink: #e8ebf0;
        --muted: #9aa3ae;
        --pill: hsl(262 55% 68%);
        --pill-ink: #14171b;
        --glow:
          radial-gradient(80% 52% at 22% 12%, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0) 74%),
          radial-gradient(90% 55% at 80% 105%, rgba(110, 90, 170, 0.14) 0%, rgba(110, 90, 170, 0) 70%);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--ground);
        color: var(--ink);
        font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      .glow {
        position: absolute;
        inset: 0;
        background: var(--glow);
      }

      /* the band above the phone; the headline block sits in its optical middle */
      header {
        position: absolute;
        left: 70px;
        right: 70px;
        top: 0;
        height: 446px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 18px;
        text-align: center;
      }
      h1 {
        position: relative;
        z-index: 0;
        margin: 0;
        font-size: 96px;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      /* the app's tag chip, around the words that carry the frame. Drawn the way the film draws it:
         the pill sits behind every line of the headline, so the line above keeps its descenders */
      .hl {
        position: relative;
        display: inline-block;
        white-space: nowrap;
        padding: 0.02em 0.3em 0.12em;
        margin: -0.02em 0 -0.12em;
        color: var(--pill-ink);
      }
      .hl::before {
        content: '';
        position: absolute;
        z-index: -1;
        left: 0;
        right: 0;
        top: 0.08em;
        bottom: 0.06em;
        border-radius: 999px;
        background: var(--pill);
      }
      header p {
        margin: 26px 0 0;
        font-size: 38px;
        line-height: 1.3;
        font-weight: 500;
        letter-spacing: -0.005em;
        color: var(--muted);
        text-wrap: balance;
      }

      /* the film's phone: screen 648 px wide (the app's 390-px chrome at 1.66x), 18 px bezel */
      .phone {
        position: absolute;
        left: 198px;
        top: 446px;
        width: 684px;
        height: 1398px;
      }
      .body {
        position: absolute;
        inset: 0;
        border-radius: 94px;
        background: linear-gradient(150deg, #3a414b 0%, #15181d 18%, #0d0f12 60%, #1b1f25 100%);
        box-shadow: -18px -18px 40px var(--hi), 24px 30px 64px var(--lo);
      }
      .night .body {
        box-shadow: 0 34px 90px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .key {
        position: absolute;
        right: -4px;
        width: 5px;
        border-radius: 0 4px 4px 0;
        background: linear-gradient(90deg, #0d0f12, #3a414b);
      }
      .screen {
        position: absolute;
        left: 18px;
        top: 18px;
        width: 648px;
        height: 1362px;
        border-radius: 76px;
        overflow: hidden;
        background: #edf0f5;
      }
      .status {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 66px;
        padding: 0 43px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .cam {
        position: absolute;
        left: 50%;
        top: 22px;
        width: 20px;
        height: 20px;
        margin-left: -10px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #2b3138 0%, #07080a 60%);
      }
      .status svg {
        display: block;
        width: 103px;
        height: 22px;
      }
      .app {
        position: absolute;
        left: 0;
        top: 66px;
        width: 648px;
        height: 1260px;
        display: block;
      }
      .nav {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 36px;
        display: grid;
        place-items: center;
      }
      .nav i {
        width: 180px;
        height: 7px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <header>
      <h1 id="headline"></h1>
      <p id="sub"></p>
    </header>
    <div class="phone">
      <div class="body"></div>
      <i class="key" style="top: 280px; height: 98px"></i>
      <i class="key" style="top: 420px; height: 168px"></i>
      <div class="screen">
        <div class="status" id="status">
          <span>1:10</span>
          <i class="cam"></i>
          <svg viewBox="0 0 62 13" fill="currentColor" aria-hidden="true">
            <path d="M1 12h2.6V8.6H1zM5 12h2.6V6.2H5zM9 12h2.6V3.8H9zM13 12h2.6V1.4H13z" />
            <path d="M28.5 12.2 21.8 5a9.6 9.6 0 0 1 13.4 0z" />
            <rect x="40.5" y="1.6" width="18" height="10" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.3" opacity="0.55" />
            <rect x="42.3" y="3.4" width="12.6" height="6.4" rx="1.4" />
            <path d="M59.9 5.1h0.9a0.7 0.7 0 0 1 0.7 0.7v1.6a0.7 0.7 0 0 1-0.7 0.7h-0.9z" opacity="0.55" />
          </svg>
        </div>
        <img class="app" id="app" alt="" />
        <div class="nav" id="nav"><i></i></div>
      </div>
    </div>

    <script>
      // [words] marks the phrase that sits on the chip
      const FRAMES = [
        { screen: '01-add.jpg', title: 'Logged in [three seconds]', sub: 'Type the amount, tap a tag. Done.' },
        { screen: '02-voice.jpg', title: 'Or just [say it]', sub: 'Hold the + and talk. Hindi works too.' },
        { screen: '03-home.jpg', title: 'Know what’s [safe to spend]', sub: 'Your monthly budget, made daily.' },
        //   keeps a phrase on one line where a break would read badly
        { screen: '04-insights.jpg', title: 'See where it [all went]', sub: 'Clear breakdowns and monthly reports.' },
        { screen: '05-budgets.jpg', title: 'Budgets that [keep pace]', sub: 'See if you’re ahead or behind, daily.' },
        { screen: '06-trip.jpg', title: 'Trips split [by themselves]', sub: 'And who pays whom, in the fewest payments.' },
        { screen: '07-dark.jpg', title: 'Easy on the eyes [at night]', sub: 'Light or dark, in soft pastel colours.', night: true },
        { screen: '08-pro.jpg', title: 'Five extras, [one payment]', sub: 'Taily Pro, on top of everything free.' }
      ]
      const n = Math.min(FRAMES.length, Math.max(1, Number(new URLSearchParams(location.search).get('n')) || 1))
      const f = FRAMES[n - 1]
      document.body.classList.toggle('night', !!f.night)
      const h1 = document.getElementById('headline')
      let chip = null
      for (const [i, part] of f.title.split(/\[|\]/).entries()) {
        if (!part) continue
        if (i % 2) {
          // the chip and any punctuation right after it break as one, so a comma never starts a line
          chip = document.createElement('span')
          chip.style.whiteSpace = 'nowrap'
          const hl = document.createElement('span')
          hl.className = 'hl'
          hl.textContent = part
          chip.appendChild(hl)
          h1.appendChild(chip)
          continue
        }
        const [, stuck, rest] = part.match(/^([,.;:!?]*)([\s\S]*)$/)
        if (stuck) (chip ?? h1).append(stuck)
        if (rest) h1.append(rest)
        chip = null
      }
      document.getElementById('sub').textContent = f.sub

      // the status bar and gesture strip take the colour of the screen's own top and bottom rows,
      // so a sheet's dimmed backdrop runs up under the clock the way it does on a phone
      const app = document.getElementById('app')
      const rowColour = (img, y) => {
        const c = document.createElement('canvas')
        c.width = img.naturalWidth
        c.height = 1
        const g = c.getContext('2d')
        g.drawImage(img, 0, y, img.naturalWidth, 1, 0, 0, img.naturalWidth, 1)
        const d = g.getImageData(0, 0, img.naturalWidth, 1).data
        let r = 0, gr = 0, b = 0, k = 0
        // the middle half of the row: clear of rounded corners and edge shadows
        for (let x = Math.floor(img.naturalWidth / 4); x < (img.naturalWidth * 3) / 4; x++, k++) {
          r += d[x * 4]
          gr += d[x * 4 + 1]
          b += d[x * 4 + 2]
        }
        return [r / k, gr / k, b / k].map(Math.round)
      }
      const ink = ([r, g, b]) => (0.2126 * r + 0.7152 * g + 0.0722 * b > 140 ? '#1a212b' : '#e8ebf0')
      app.onload = async () => {
        const top = rowColour(app, 1)
        const bottom = rowColour(app, app.naturalHeight - 2)
        const status = document.getElementById('status')
        status.style.background = `rgb(${top})`
        status.style.color = ink(top)
        const nav = document.getElementById('nav')
        nav.style.background = `rgb(${bottom})`
        nav.firstElementChild.style.background = ink(bottom)
        nav.firstElementChild.style.opacity = '0.5'
        await document.fonts.ready
        document.body.dataset.ready = '1'
      }
      app.src = `screens/${f.screen}`
    </script>
  </body>
</html>
