name: Deploy web app

# The hosted web app at https://jatin-dhir.github.io/snowy/ (GitHub Pages serves a
# project site under its repo name, and vite.config.ts sets the matching base path).
# Redeploys on every push to main that touches
# the app itself, and on demand from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'android/**'
      - 'store/**'
      - 'releases/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc + vite build --mode web: no GitHub self-updater, web channel marker
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
